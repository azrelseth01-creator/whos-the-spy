<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who’s the Spy? Host Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="fx-on">
<header>
  <h1>Who’s the Spy? <span style="color:var(--mute);font-weight:400">Host helper</span></h1>
  <button class="btn" id="musBtn" aria-pressed="true">Music: on</button>
  <button class="btn" id="lockBtn" title="Lock the screen">Lock</button>
  <button class="btn" id="setBtn">Settings</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="scrim" id="lock"><div class="modal">
  <h2>Host only</h2><p class="sub">Enter the host PIN to continue.</p>
  <input type="password" id="pinIn" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <div class="gap"></div><button class="btn pri" id="pinGo" style="width:100%">Unlock</button>
</div></div>

<div class="scrim" id="settings"><div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
  <h2>Settings</h2><div class="gap"></div>
  <div class="set"><span>Discussion timer (seconds)</span><input type="number" id="sTime" min="10" max="1800" step="10"></div>
  <div class="set"><span>Sound effects</span><input type="checkbox" id="sSfx"></div>
  <div class="set"><span>Background music</span><input type="checkbox" id="sMus"></div>
  <div class="set"><span>Music volume</span><input type="range" id="sMVol" min="0" max="1" step=".05"></div>
  <div class="set"><span>Effects volume</span><input type="range" id="sVol" min="0" max="1" step=".05"></div>
  <div class="set"><span>Visual effects</span><input type="checkbox" id="sVfx"></div>
  <div class="set"><span>Theme</span><select id="sTheme"><option value="auto">Match device</option><option value="dark">Dark</option><option value="light">Light</option></select></div>
  <div class="set"><span>Host PIN (blank = off)</span><input type="password" id="sPin" inputmode="numeric" placeholder="e.g. 1234" style="width:110px"></div>
  <div class="gap"></div>
  <div class="row"><button class="btn bad" id="sReset">New game</button><button class="btn pri" id="sClose" style="margin-left:auto">Done</button></div>
</div></div>

<canvas id="bg"></canvas><canvas id="fx"></canvas><div class="flash" id="flash"></div><div class="toast" id="toast"></div>

<script src="js/words.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/vfx.js"></script>
<script src="js/helpers.js"></script>
<script src="js/timer.js"></script>
<script src="js/views.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
